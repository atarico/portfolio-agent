name: CI

on:
  # No branch filter here on purpose. That filter matches the pull request's BASE
  # branch, so a pull request stacked on another feature branch would get no
  # check at all - exactly when review needs one, since a stacked change is
  # usually the harder half of a split. Pushes stay limited to main.
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow never writes to the repository, comments, or deploys.
permissions:
  contents: read

# A newer push to the same ref supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pinned version from package.json "packageManager",
      # so CI and local development cannot drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # 22 is the floor declared in "engines". Running the floor here proves
      # it still works even while local development is on a newer Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Fails if the lockfile does not match the manifests, instead of
      # silently resolving different versions than the ones committed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm -r test
